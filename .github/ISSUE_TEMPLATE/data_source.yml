name: Data source proposal
description: Propose a public dataset that would make places more recognisable.
labels: ["data", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        SimCruise only uses data that is free to use **without an account or API key**. ODbL and ShareAlike data is fetched at runtime and never committed to the repository.
  - type: input
    id: name
    attributes:
      label: Dataset name and publisher
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link to the dataset or service
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Licence or terms of use
      description: Link to the licence text if you can.
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: Access
      options:
        - Open, no key or account
        - Needs a free account or key
        - Paid
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What would it add in the game?
      description: Coverage area, resolution, and what a driver would see or feel.
    validations:
      required: true

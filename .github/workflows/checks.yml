# The default headless check suite (scripts/check.sh) on Linux: Godot's
# headless mode needs no GPU or display, and the suite needs no network or Bun.
# It takes about four minutes on a desktop (import included).
name: Checks

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "authoring/**", "lab/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "authoring/**", "lab/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  headless:
    name: Headless checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Godot 4.7.2 (github.com/godotengine/godot)
        run: |
          godot=$(sh scripts/install-godot.sh "$RUNNER_TEMP/godot" | tail -n 1)
          "$godot" --headless --version
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"
      - name: scripts/check.sh
        env:
          CHECK_LOG_DIR: ${{ runner.temp }}/check-logs
        run: sh scripts/check.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-logs
          path: ${{ runner.temp }}/check-logs
          retention-days: 7

# Build the Windows and macOS releases for a version tag and open a DRAFT
# GitHub release with the installers, the portable zip, SHA256SUMS.txt and the
# matching CHANGELOG.md entry as notes. Nothing is published: a maintainer
# reviews the draft and presses "Publish release".
#
# Release steps (docs/building.md, "Releasing"):
#   1. set config/version in game/project.godot to X.Y.Z;
#   2. rename "## Unreleased" in CHANGELOG.md to "## SimCruise X.Y.Z (YYYY-MM-DD)";
#   3. commit, then `git tag vX.Y.Z && git push origin vX.Y.Z`.
# To rebuild an existing tag, run this workflow by hand with that tag; an
# existing draft gets its files and notes replaced, a published release is
# never touched.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Always build the tag itself, never a branch of the same name.
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  BUN_VERSION: "1.4.4"

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Check version and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - id: version
        name: Tag must match config/version and have a CHANGELOG entry
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag=$REF_NAME
          if [ "$EVENT" = workflow_dispatch ]; then tag=$INPUT_TAG; fi
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$tag' is not vX.Y.Z"; exit 1
          fi
          version=${tag#v}
          project=$(sed -n 's/^config\/version="\(.*\)"/\1/p' game/project.godot)
          if [ "$project" != "$version" ]; then
            echo "::error::game/project.godot has config/version=\"$project\" but the tag is $tag. Bump config/version before tagging."; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/notes"
          if ! sh scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes/changelog.md"; then
            echo "::error::CHANGELOG.md has no '## SimCruise $version (date)' entry."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release $tag: $(wc -l < "$RUNNER_TEMP/notes/changelog.md") lines of notes"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/changelog.md
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows installer and zip
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: NSIS 3
        run: |
          if command -v makensis >/dev/null 2>&1 || [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            echo "NSIS already installed"
          else
            choco install nsis --no-progress -y
          fi
      - name: Godot 4.7.2 and its Windows export templates (github.com/godotengine/godot)
        run: |
          godot=$(sh scripts/install-godot.sh "$RUNNER_TEMP/godot" windows | tail -n 1)
          "$godot" --version
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"
      - name: Build
        run: sh scripts/build-windows.sh "$VERSION"
      - name: Smoke test (headless start of the portable build)
        run: sh scripts/smoke-windows.sh "build/SimCruise-$VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            build/SimCruise-${{ env.VERSION }}-windows-x64-setup.exe
            build/SimCruise-${{ env.VERSION }}-windows-x64.zip
            build/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS disk image
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Godot 4.7.2 and its macOS export template (github.com/godotengine/godot)
        run: |
          godot=$(sh scripts/install-godot.sh "$RUNNER_TEMP/godot" macos | tail -n 1)
          "$godot" --version
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"
      - name: Build the app
        run: sh scripts/build-macos.sh app
      - name: Smoke test (the signed app starts)
        run: |
          out=$(build/SimCruise.app/Contents/MacOS/SimCruise --headless --version 2>&1)
          echo "$out"
          case "$out" in *4.7.2.stable*) ;; *) echo "::error::SimCruise.app did not start"; exit 1;; esac
      - name: Disk image
        # hdiutil on hosted runners sometimes reports "Resource busy"; retry.
        run: |
          for attempt in 1 2 3; do
            if sh scripts/make-dmg.sh "$VERSION" build/SimCruise.app build; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 15
          done
          (cd build && shasum -a 256 "SimCruise-$VERSION.dmg" > SHA256SUMS-macos.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            build/SimCruise-${{ env.VERSION }}.dmg
            build/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft GitHub release
    needs: [prepare, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          # The per-platform sums were written on the build machines; checking
          # them here catches any change in transit.
          sha256sum -c SHA256SUMS-windows.txt SHA256SUMS-macos.txt
          sha256sum "SimCruise-$VERSION.dmg" "SimCruise-$VERSION-windows-x64-setup.exe" \
            "SimCruise-$VERSION-windows-x64.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Notes
        run: |
          {
            # Links in CHANGELOG.md are relative to the repository root; on the
            # release page they would resolve under /releases/tag/, so point
            # them at the tagged files.
            sed -E "s#\]\(([^)#:/][^):]*)\)#](https://github.com/$GH_REPO/blob/$TAG/\1)#g" dist/changelog.md
            printf '\n## Downloads\n\n'
            printf -- '- **macOS** (Apple Silicon, macOS 13 or newer): `SimCruise-%s.dmg`\n' "$VERSION"
            printf -- '- **Windows** 10/11 64-bit: `SimCruise-%s-windows-x64-setup.exe` (installer) or `SimCruise-%s-windows-x64.zip` (portable)\n' "$VERSION" "$VERSION"
            printf '\nThe Mac app is signed ad hoc but not notarized, and the Windows build is not code-signed; first-launch steps for Gatekeeper and SmartScreen are in [docs/install.md](https://github.com/%s/blob/%s/docs/install.md).\n' "$GH_REPO" "$TAG"
            printf '\n### SHA-256\n\n```\n'
            cat dist/SHA256SUMS.txt
            printf '```\n'
          } > notes.md
      - name: Create or update the draft
        run: |
          files="dist/SimCruise-$VERSION.dmg dist/SimCruise-$VERSION-windows-x64-setup.exe dist/SimCruise-$VERSION-windows-x64.zip dist/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::Release $TAG is already published; not changing it."; exit 1
            fi
            # shellcheck disable=SC2086
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --title "SimCruise $VERSION" --notes-file notes.md
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" --draft --verify-tag --title "SimCruise $VERSION" --notes-file notes.md $files
          fi
          echo "Draft release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

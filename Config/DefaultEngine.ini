[/Script/Engine.PhysicsSettings]
; Vehicle physics core (docs/unreal-architecture.md): Chaos steps at a fixed
; 360 Hz on the physics thread; the SimCruise vehicle evaluates every wheel
; force inside that step.
bTickPhysicsAsync=True
AsyncFixedTimeStepSize=0.0027777778
; The physics may catch up a frame of up to 0.1 s (36 steps). The engine's default 1/30 s
; ran the world in slow motion below 30 fps: at 15 fps the car moved at half speed.
MaxPhysicsDeltaTime=0.1

[/Script/NNERuntimeORT.NNERuntimeORTSettings]
; The AI detail engine (Live/SimCruiseNeuralDetail) runs on the CPU in the background: three
; ONNX Runtime threads leave the game, render and RHI threads their cores.
EditorThreadingOptions=(bUseGlobalThreadPool=True,IntraOpNumThreads=3,InterOpNumThreads=1,ExecutionMode=SEQUENTIAL)
GameThreadingOptions=(bUseGlobalThreadPool=True,IntraOpNumThreads=3,InterOpNumThreads=1,ExecutionMode=SEQUENTIAL)

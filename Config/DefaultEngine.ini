[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Templates/OpenWorld
GameInstanceClass=/Script/SimCruise.SimCruiseGameInstance

[/Script/Engine.RendererSettings]
; Light, sky and rendering (docs/unreal-architecture.md). Everything is dynamic: the sun
; follows the real clock, so there is no baked lighting at all.
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
; Car paint: metallic flakes perturb the base coat under a smooth clear coat (Presentation/).
r.ClearCoatNormal=True
; Lumen for global illumination and reflections, traced against mesh distance fields
; (software Lumen; the RTX 2070 Max-Q gains little from hardware tracing at its cost).
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Lumen.TraceMeshSDFs=1
r.Lumen.HardwareRayTracing=False
; Temporal Super Resolution: every preset renders below output resolution and upscales.
r.AntiAliasingMethod=4
; Physically based sky and clouds; height fog takes the atmosphere's colour.
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
; Physical camera: auto exposure in EV100 (histogram), so the sun can be 128 klx and the
; moon 0.3 lx. The environment narrows the band around the scene's reference EV.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.Bias=1.0
; Local exposure compresses the tropical sun's contrast the way a phone camera's HDR does.
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.LensFlare=False
; Screen percentage is set per preset (FSimCruiseGraphics); keep it out of display-based modes.
r.ScreenPercentage.Default=67
r.ScreenPercentage.Default.Desktop.Mode=0


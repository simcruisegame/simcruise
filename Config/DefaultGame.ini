[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=6B21B164763A4289A079BDFAC1EF9012
ProjectName=SimCruise
ProjectVersion=2.0.0-preview.1
Description=A data-driven real-place driving simulator.

[/Script/SimCruise.SimCruiseGameMode]
; The real car on Chaos (Vehicle/); the shell's placeholder is only a fallback.
VehiclePawnClass=/Script/SimCruise.SimCruiseVehicle
; A drive starts in the 1999 roadster on Ocean Drive, Miami Beach (bundled, offline).
StartCarId=nb2001
StartRoad=Ocean Drive

[/Script/Engine.AssetManagerSettings]
; The engine's game-features plugin needs this rule (without it every commandlet and cook logs two errors).
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

[/Script/UnrealEd.ProjectPackagingSettings]
; The materials are loaded by path from code (no map references them), so the cook must be told.
+DirectoriesToAlwaysCook=(Path="/Game/World/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Vehicles/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Vehicle/Materials")
; The volumetric cloud component points at this material only by a soft path.
+DirectoriesToAlwaysCook=(Path="/Engine/EngineSky/VolumetricClouds")

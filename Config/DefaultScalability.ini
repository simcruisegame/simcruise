; SimCruise scalability overrides on top of Engine/Config/BaseScalability.ini.
; Presets Low/Medium/High/Ultra are scalability levels 0/1/2/3 (FSimCruiseGraphics), each
; with its own TSR screen percentage. Frame times on the RTX 2070 Super Max-Q at 1080p are
; in docs/unreal-architecture.md ("Light, sky and rendering").
;
; Measured with ProfileGPU in the lighting lab at Ultra before these overrides (18.9 ms):
; volumetric cloud shadow + cloud sky occlusion 6.0 ms, TSR at a 200 % history 4.0 ms.

; Cloud shadows on the ground and cloud occlusion of the sky light. The engine default is a
; 128-step march into a map up to 2048 texels for every frame; fair-weather cumulus at 1-7 km
; needs far less, and the maps are temporally filtered. The cost follows the map size: at
; 768 texels the march still took 4.6 ms, at 256 well under 1 ms.
[ShadowQuality@0]
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=12
r.VolumetricCloud.ShadowMap.MaxResolution=192
r.VolumetricCloud.SkyAO.MaxResolution=128
r.VolumetricCloud.SkyAO.TraceSampleCount=4

[ShadowQuality@1]
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=12
r.VolumetricCloud.ShadowMap.MaxResolution=192
r.VolumetricCloud.SkyAO.MaxResolution=192
r.VolumetricCloud.SkyAO.TraceSampleCount=5

; High (the default on the RTX 2070 Super Max-Q): the drive's ProfileGPU (11 Nov, round 2) still
; showed 2.1 ms in CloudShadow at 384 texels and 24 steps; 192 and 12 take 0.56 ms (frame 16.1 ->
; 14.4 ms in the driver's seat), with the shadow map covering 20 km so its texels stay 100 m.
[ShadowQuality@2]
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=12
r.VolumetricCloud.ShadowMap.MaxResolution=192
r.VolumetricCloud.SkyAO.MaxResolution=256
r.VolumetricCloud.SkyAO.TraceSampleCount=6

; Ultra and Medium use High's cloud shadow too: on the GPU held at 28 W the 384-texel, 32-step march
; took 8.6 ms of a 29 ms frame on Tail of the Dragon, 192 and 12 took 5.1 ms (2026-11-13); the
; shadow of a 1-7 km cumulus needs no finer texels than 100 m.
; Ultra: sun shadow pages at -0.75 (the engine's Epic is -1.5) and view distance 0.85 hold 60 fps
; at Ultra on the RTX 2070 Super Max-Q at full power. Stick to picture 101 -> 96 ms on Ocean
; Drive; the Lummus Park shadows and realism score (45.6 / 45.7) look the same (2026-11-14).
[ShadowQuality@3]
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.75
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=-0.75
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=12
r.VolumetricCloud.ShadowMap.MaxResolution=192
r.VolumetricCloud.SkyAO.MaxResolution=384
r.VolumetricCloud.SkyAO.TraceSampleCount=8

; Ultra keeps TSR's full-quality history update but at the output resolution: a 200 % history
; cost 2.2 ms of a 4.0 ms TSR at 1080p for detail the 1080p output cannot show.
[AntiAliasingQuality@3]
r.TSR.History.ScreenPercentage=100

[ViewDistanceQuality@3]
r.ViewDistanceScale=0.85

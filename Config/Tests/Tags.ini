; The slow automation tests: scripts\check.ps1 -Tier fast skips every test tagged [Slow] here;
; -Tier full (the default, run before a merge) runs them all. Unreal reads this file itself
; (FAutomationTestFramework::LoadTestTagMappings), so the editor's test list shows the tags too.
; One line per full test name. A test that is not listed is in the fast tier, so a new test
; runs in both tiers until it is listed here. Times from a full run on 2026-11-12.

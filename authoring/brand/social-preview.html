<!doctype html>
<!-- OSDS social preview, 1280 x 640. Render:
     python authoring/brand/render_brand.py html authoring/brand/social-preview.html docs/images/social-preview.png 1280 640
     Photo: an OSDS game screenshot (our own work). Map data in the photo: OpenStreetMap contributors (ODbL). -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:OverpassX;src:url("../../data/fonts/overpass/Overpass-ExtraBold.ttf")}
@font-face{font-family:OverpassB;src:url("../../data/fonts/overpass/Overpass-Bold.ttf")}
@font-face{font-family:OverpassR;src:url("../../data/fonts/overpass/Overpass-SemiBold.ttf")}
html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#1B2128}
.photo{position:absolute;inset:0;background:url("../../docs/images/release-2.0.2/07-corvette-big-sur-chase.jpg") -170px center/auto 100% no-repeat}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(27,33,40,0) 0%,rgba(27,33,40,0) 34%,rgba(27,33,40,.92) 56%,#1B2128 64%)}
.panel{position:absolute;left:790px;top:0;bottom:0;right:48px;display:flex;flex-direction:column;justify-content:center;color:#fff}
.logo{width:420px;margin-bottom:46px}
h1{font:44px/1.08 OverpassX;margin:0 0 18px;letter-spacing:-.3px}
.l2{font:27px/1.3 OverpassB;color:#F4EFE4;margin:0 0 22px}
.l3{font:21px/1.5 OverpassR;color:#C4CCD6}
.amber{color:#F5B53F}
.credit{position:absolute;right:16px;bottom:10px;font:14px OverpassR;color:#C4CCD6}
</style></head><body>
<div class="photo"></div><div class="fade"></div>
<div class="panel">
  <img class="logo" src="../../docs/brand/svg/osds-lockup-full-color.svg" alt="OSDS">
  <h1>Free, <span class="amber">open-source</span><br>driving simulator</h1>
  <div class="l2">Drive the real roads<br>anywhere in the US</div>
  <div class="l3">Unreal Engine 5 · Windows<br>Wheel, controller or keyboard</div>
</div>
<div class="credit">Big Sur, California 1 · map data © OpenStreetMap contributors</div>
</body></html>
